name: Release

# 发布由 changesets 托管，不再手动改版本、也不用手动打 tag：
#
#   push main
#     ├─ 有未发布的 changeset → 自动开 / 更新 "Version Packages" PR
#     │    （该 PR 里写好了新版本号与 CHANGELOG）
#     └─ 该 PR 被合并 → 这次 push 直接把包发到 npm，并打 tag、建 GitHub Release
#
# 「有改动的 PR」要跑一次 `pnpm changeset` 写变更说明，决定下次是 patch / minor / major；
# 纯文档或工具链改动用 `pnpm changeset --empty` 记一个不发布版本的 changeset。
#
# 认证走 npm 的 Trusted Publishing（OIDC）：仓库里不保存任何 npm token，凭据由
# GitHub Actions 现场换取。因此按官方建议拆成 select-mode / version / pack / publish
# 四个 job，把 id-token: write 只留给真正执行发布的那个 job。
#
# 一次性配置：
#   1. npm：@hsinyau/design-system → Settings → Trusted Publisher → GitHub Actions
#        Organization or user: hsinyau
#        Repository:           design-system
#        Workflow filename:    publish.yml   （只填文件名，不带路径）
#        Environment name:     留空
#        Allowed actions:      勾上 npm publish（默认只允许 npm stage publish）
#   2. GitHub：仓库 Settings → Actions → General 里允许
#      "Allow GitHub Actions to create and approve pull requests"，否则 version job 开不出 PR。
on:
  push:
    branches:
      - main

# 官方建议：先重置权限，再按 job 单独声明
permissions: {}

# 同一分支上的发布串行执行，避免两个 Version PR / 两次发布撞车
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  NODE_VERSION: 24
  # 与 Cloudflare 构建镜像保持一致，避免两边 pnpm 行为差异
  PNPM_VERSION: 10.11.1

jobs:
  # 只读：跑自检，并判断这次该「升版本」还是「发布」
  select-mode:
    name: 判定 version / publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 自检
        run: |
          pnpm check:tokens
          pnpm check:classes
          pnpm build
      - name: 选择模式
        id: select-mode
        uses: changesets/action/select-mode@v2

  # 写权限：把 changeset 变成版本号与 CHANGELOG，并开 / 更新 Version Packages PR
  version:
    name: 开 / 更新 Version Packages PR
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write # 提交版本改动与 CHANGELOG
      pull-requests: write # 创建 / 更新 PR
    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 升版本
        uses: changesets/action/version@v2

  # 只读：构建并把待发布的包打成 tarball，产物通过 artifact 传给 publish
  pack:
    name: 打包
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建库产物
        run: pnpm build:lib
      - name: 打包
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  # 唯一带 id-token 的 job：用 OIDC 发布，再打 tag、建 Release。
  #
  # 一个隐藏前提：changesets 按仓库类型选发布工具，pnpm workspace 里固定走 `pnpm publish`。
  # pnpm v11 起 publish 改为自身实现、不再委托 npm CLI，而 pnpm 目前不支持 npm 的
  # Trusted Publishing。所以这里把 pnpm 钉在 10.x —— 它会把 publish 委托给 npm CLI，
  # 由 npm（>= 11.5.1）完成 OIDC 换证。将来要升级 pnpm 大版本时，得先把这几步换成
  # `npm publish` 直发。
  publish:
    name: 发布到 npm（OIDC）
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # 打 tag、创建 GitHub Release
      id-token: write # Trusted Publishing
    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # Trusted Publishing 需要 npm CLI >= 11.5.1
      - name: 升级 npm
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # 排查 OIDC 认证用：确认 npm 版本够用，且 id-token 权限真的注入到了环境变量
      - name: 发布前诊断
        run: |
          echo "npm: $(npm --version)"
          echo "pnpm: $(pnpm --version)"
          node -e "console.log('OIDC:', process.env.ACTIONS_ID_TOKEN_REQUEST_URL ? 'available' : 'MISSING (检查本 job 的 id-token: write)')"
      - name: 发布
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
