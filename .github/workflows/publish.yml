name: publish

# 打 tag 即发布：tag 名去掉 v 前缀必须等于 packages/design-system/package.json 的 version。
#   git tag v0.1.1 && git push origin v0.1.1
# 也可以在 Actions 页面手动触发（用 package.json 当前版本；该版本已存在时 npm 会拒绝）。
#
# 认证走 npm 的 Trusted Publishing（OIDC）：仓库里不保存任何 npm token，
# 凭据由 GitHub Actions 的 id-token 现场换取，只对本仓库的这个 workflow 文件有效。
#
# 一次性配置（在 npm 网站上做）：
#   @hsinyau/design-system → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: hsinyau
#     Repository:           design-system
#     Workflow filename:    publish.yml     （只填文件名，不要带 .github/workflows/ 路径）
#     Environment name:     留空            （本 workflow 不使用 GitHub environment）
#     Allowed actions:      勾上 npm publish（默认只允许 npm stage publish，不勾会发布失败）
#
# 两个硬性要求（都在下面处理了）：
#   - npm CLI ≥ 11.5.1：Node 22 自带的 npm 版本不够，所以显式升级；
#   - 不要给 setup-node 传 registry-url：它会写入 //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}，
#     与环境里不存在的 token 变量组合容易干扰 OIDC 认证；registry 由包内 publishConfig.registry 指定。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC 换取 npm 短期凭据，必须

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      # 与 Cloudflare 构建镜像用同一个 pnpm 版本，避免两边行为差异
      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 升级 npm（Trusted Publishing 需要 npm >= 11.5.1）
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 自检
        run: |
          pnpm check:tokens
          pnpm check:classes
          pnpm build

      - name: 校验 tag 与包版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./packages/design-system/package.json').version")
          tag=${GITHUB_REF_NAME#v}
          echo "package.json: $version / tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与包版本 $version 不一致：先改 packages/design-system/package.json 再重新打 tag"
            exit 1
          fi

      # 在包目录里发布：prepublishOnly 会自动重建 dist/（独立产物 + 字体）。
      # registry 与 access 来自 package.json 的 publishConfig；凭据由 OIDC 现场换取。
      # 想同时生成构建溯源，把命令换成 `npm publish --provenance`。
      - name: 发布到 npm
        working-directory: packages/design-system
        run: npm publish

      - name: 确认 registry 上的版本
        run: npm view @hsinyau/design-system version
